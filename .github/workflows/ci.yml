name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile Python modules
        run: python -m compileall -q paperstudio
      - name: Run unit and integration tests (no paid API)
        run: python -m pytest tests -q
  windows-source-tests:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify CMD launcher encoding and run tests
        run: python -m pytest tests -q
      - name: Regression check - legacy CP1252 log output
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'cp1252:strict'
          python tools/windows_bootstrap.py --mode doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PYTHONIOENCODING
      - name: Web source self-test
        run: python studio_web.py --self-test
